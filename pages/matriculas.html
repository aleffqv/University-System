<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matriculas</title>
  <link rel="stylesheet" href="../style/main.css">
</head>
<body>

<div id="sidebar-container"></div>
<script src="../js/loadComponents.js"></script>

<div class="main">

   <div class="top-header">
    <div>Administrador</div>
   </div>

  <div class="content">



    <div>
        <h2>Gestão de Matriculas</h2>
        <p>Gerenciamento de matriculas na universidade</p>
    </div>
    <hr>

    <div class="op-alunos">

        <button class="bt-cad"> + Cadastrar Aluno</button>
        <div class="dropdown">

        <select class="filter" name="curso" id="cursoDropdown">
            <option value="">Filtrar por curso</option>

        </select>

        <select name="turma" id="turmaDropdown">
            <option value="">Filtrar por turma</option>

        </select>

        <div class="search-wrapper">
            <select id="tipoBusca" class="search-select">
                <option value="nome">Nome</option>
                <option value="codigo">Código</option>
                <option value="email">Email</option>
                <option value="curso">Curso</option>
                <option value="matricula">Matrícula</option>
            </select>
  
            <input type="text" id="campoBusca" class="search-input" placeholder="Digite sua busca...">
  
            <button id="btnBuscar" class="search-button">Filtrar</button>
        </div>
    </div>
    </div>



<div class="down-main">
    <div class="container-alunos-tab">
        <div class="lista-alunos">
            <h2>Lista de Matriculas</h2>
            <table class="tabela-alunos">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Aluno</th>
                    <th>Turma</th>
                    <th>Curso</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
                <tbody id="tabela-alunos-body"></tbody>
            </table>
        </div>


        <div class="tabelasDeFuncoes">

            
        </div>


        
    </div>
</div>

<div id="modal-aluno-container"></div>
<script src="../js/loadModalAluno.js"></script>
<div id="modal-visualizar-aluno-container"></div>
<script src="../js/loadViewAluno.js"></script>
<script defer src="../js/data/aluno.js"></script>


</body>
</html>
