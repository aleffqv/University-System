<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departamentos</title>
    <link rel="stylesheet" href="../style/main.css">
</head>
<body>

<div id="sidebar-container"></div>
<script src="../js/loadComponents.js"></script>

<div class="main">
  
    <div class="top-header">
        <div>Administrador</div>
    </div>

    <div class="content">
        <div>
            <h2>Gestão de Departamentos</h2>
            <p>Gerenciamento de Departamentos da universidade</p>
        </div>
        <hr>

        <div class="op-dep">
            <button class="bt-cad"> + Cadastrar Departamento</button>
            <input type="text" id="campoBusca" class="search-input" placeholder="Buscar Departamento... ">
            <button id="btnBuscar" class="search-button">Filtrar</button>
        </div>

        <div class="down-main">
            <div class="container-alunos-tab"> 
                <div class="lista-alunos"> 
                    <h2>Lista de Departamentos</h2>
                    <table class="tabela-alunos">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nome</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                        <tbody id="tabela-dep-body"></tbody>
                    </table>
                </div>

                <div class="tabelasDeFuncoes">
                    <div class="funcTable">
                        <h3>Adicionar Curso a Departamento</h3>
                        <br>
                        <p>Selecione o curso</p>
                        <br>
                        <select class="selectop" name="curso" id="cursoDropdown">
                            <option value="">Selecione um Curso</option>
                        </select>

                        <p>Selecione o Departamento</p>
                        <br>
                        <select class="selectop" name="departamento" id="departamentoDropdown">
                            <option value="">Selecione um departamento</option>
                        </select>
                        <br>

                        <button class="botaoAzul">Adicionar curso</button>
                    </div>

                    <div class="funcTable">
                        <h3>Adicionar Professor a Departamento</h3>
                        <br>
                        <p>Selecione o professor</p>
                        <br>
                        <select class="selectop" name="professor" id="cursoDropdown">
                            <option value="">Selecione um Professor</option>
                        </select>

                        <p>Selecione o Departamento</p>
                        <br>
                        <select class="selectop" name="departamento" id="departamentoDropdown">
                            <option value="">Selecione um departamento</option>
                        </select>
                        <br>

                        <button class="botaoAzul">Adicionar professor</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="modal-dep-container"></div>
<script src="../js/loadModalDepartamento.js"></script>
<div id="modal-visualizar-dep-container"></div>
<script src="../js/loadViewDep.js"></script>
<script src="../js/data/departamentos.js"></script>

</body>
</html>
